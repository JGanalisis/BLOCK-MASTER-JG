const cv=$('board'),ctx=cv.getContext('2d'),W=10,H=20,S=30;
const shapes=[{m:[[1,1,1,1]],c:'#00d9f2'},{m:[[1,1],[1,1]],c:'#ffd43b'},{m:[[0,1,0],[1,1,1]],c:'#b56cff'},{m:[[1,0,0],[1,1,1]],c:'#398cff'},{m:[[0,0,1],[1,1,1]],c:'#ff9138'},{m:[[0,1,1],[1,1,0]],c:'#35e28b'},{m:[[1,1,0],[0,1,1]],c:'#ff5478'}];let board,piece,next,score,lines,level,best=Number(safeStore.get('bmjg-best','0')),active=false,paused=false,over=false,last=0,acc=0,raf=0,particles=[],flash=0,goalFx=0;

function hit(p,dx=0,dy=0,m=p.m){for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++)if(m[y][x]){let xx=p.x+x+dx,yy=p.y+y+dy;if(xx<0||xx>=W||yy>=H||(yy>=0&&board[yy][xx]))return true}return false}
function spawn(){piece=make(next);next=rand();if(hit(piece))finish()}
function rotate(){let m=piece.m[0].map((_,i)=>piece.m.map(r=>r[i]).reverse());for(let k of [0,-1,1,-2,2])if(!hit(piece,k,0,m)){piece.x+=k;piece.m=m;break}}

function act(a){if(!active||paused||over)return;if(a==='left'&&!hit(piece,-1))piece.x--;if(a==='right'&&!hit(piece,1))piece.x++;if(a==='down'){if(!hit(piece,0,1)){piece.y++;score++}else lock()}if(a==='rotate')rotate();if(a==='drop'){let d=0;while(!hit(piece,0,1)){piece.y++;d++}score+=d*2;lock()}update();draw()}

function cell(color,x,y,alpha=1){ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.fillRect(x*S+1,y*S+1,S-2,S-2);ctx.fillStyle='#ffffff66';ctx.fillRect(x*S+3,y*S+3,S-6,4);ctx.fillStyle='#00000018';ctx.fillRect(x*S+3,y*S+S-6,S-6,3);ctx.strokeStyle='#0008';ctx.lineWidth=1;ctx.strokeRect(x*S+1,y*S+1,S-2,S-2);ctx.globalAlpha=1}

 ctx.textAlign='center';ctx.font='900 30px system-ui';ctx.lineWidth=4;ctx.strokeStyle='#06251e';ctx.strokeText('¡GOOOL!',150,160);ctx.fillStyle='#ffffff';ctx.shadowColor='#00eaff';ctx.shadowBlur=18;ctx.fillText('¡GOOOL!',150,160);
 ctx.restore();goalFx=Math.max(0,goalFx-.018);
}
for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(board[y][x])cell(board[y][x],x,y);if(piece){let g={...piece};while(!hit(g,0,1))g.y++;g.m.forEach((r,y)=>r.forEach((v,x)=>{if(v)cell(piece.c,g.x+x,g.y+y,.22)}));piece.m.forEach((r,y)=>r.forEach((v,x)=>{if(v)cell(piece.c,piece.x+x,piece.y+y)}))}if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*.42)+')';ctx.fillRect(0,0,300,600);flash=Math.max(0,flash-.09)}particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.13;p.life-=.035;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=10;ctx.fillRect(p.x,p.y,p.size,p.size);ctx.shadowBlur=0});ctx.globalAlpha=1}
function show(title,txt,icon='⚽',button='JUGAR DE NUEVO'){ $('ovTitle').textContent=title;$('ovText').textContent=txt;$('ovIcon').textContent=icon;$('ovButton').textContent=button;$('overlay').classList.add('show')}

function tick(t){if(!active)return;let dt=Math.min(t-last,100);last=t;if(!paused&&!over){acc+=dt;if(acc>=Math.max(90,800-(level-1)*65)){acc=0;if(!hit(piece,0,1))piece.y++;else lock()}draw()}raf=requestAnimationFrame(tick)}
